<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wonderbyte">
<meta name="description" content="Kids teach Bit the robot how AI works - patterns, training data, fairness, confidence and fake photos. Offline, no ads, no accounts.">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#6C5CE7">
<title>Wonderbyte - Teach Bit the Robot!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --purple:#6C5CE7; --purple-dark:#5a4bd1; --teal:#00CEC9; --pink:#FF6B9D;
  --yellow:#FFD93D; --orange:#FF9F43; --red:#FF6B6B; --green:#1DD1A1;
  --ink:#2D3436; --card:#FFFFFF; --sky1:#74b9ff; --sky2:#a29bfe;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:ui-rounded,'SF Pro Rounded','Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
  background:linear-gradient(180deg,#7FC8FF 0%,#a29bfe 60%,#6C5CE7 100%);
  color:var(--ink); min-height:100vh; display:flex; justify-content:center;
}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;padding:14px 14px 30px}
.screen{display:none;flex-direction:column;flex:1;animation:pop .35s ease}
.screen.on{display:flex}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-size:30px;line-height:1.15;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}
h2{font-size:22px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.12);margin-top:14px}
.btn{
  display:block;width:100%;border:none;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:19px;padding:16px 20px;border-radius:20px;color:#fff;background:var(--purple);
  box-shadow:0 5px 0 var(--purple-dark);margin-top:14px;transition:transform .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--purple-dark)}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 #00a8a4}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #d14d7e}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 #d97f26}
.btn.green{background:var(--green);box-shadow:0 5px 0 #12a37c}
.btn.ghost{background:#fff;color:var(--purple);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.btn.small{font-size:15px;padding:10px 14px;width:auto;display:inline-block}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
.big-emoji{font-size:52px;text-align:center;display:block}
.center{text-align:center}
.muted{color:#636e72;font-size:14px}
.bit-wrap{display:flex;justify-content:center;margin:8px 0}
.bit-float{animation:floaty 2.6s ease-in-out infinite}
.bit-bounce{animation:bounce .7s ease infinite}
.bit-wiggle{animation:wiggle .4s ease infinite}
.wotd-strip{display:flex;gap:10px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.wotd-card{flex:1 0 78%;scroll-snap-align:start;background:linear-gradient(150deg,#2D3436 0%,#3d4650 100%);border-radius:20px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer;transition:transform .08s}
.wotd-card:active{transform:scale(.97)}
.wotd-label{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--teal)}
.wotd-word{font-size:26px;font-weight:900;color:var(--yellow);margin-top:2px}
.wotd-def{font-size:14px;font-weight:700;color:#fff;margin-top:4px;line-height:1.35}
.wotd-eg{font-size:12.5px;color:var(--teal);margin-top:6px;font-style:italic;line-height:1.35}
.wotd-emoji{float:right;font-size:30px;margin-left:8px}
.speech{
  position:relative;background:#fff;border-radius:18px;padding:12px 16px;margin:10px auto 0;
  max-width:320px;font-size:16px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.speech:before{
  content:'';position:absolute;left:50%;top:-10px;transform:translateX(-50%);
  border:10px solid transparent;border-top:0;border-bottom-color:#fff;
}
.island{
  background:#fff;border-radius:24px;padding:16px;margin-top:14px;display:flex;gap:14px;align-items:center;
  box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:pointer;border:4px solid transparent;transition:transform .1s;
}
.island:active{transform:scale(.97)}
.island.locked{opacity:.65;cursor:default}
.island.next{border-color:var(--yellow)}
.island .scene{font-size:44px}
.island .meta{flex:1}
.island .meta h3{font-size:19px}
.island .meta p{font-size:13px;color:#636e72;margin-top:2px}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;color:#fff}
.badge.done{background:var(--green)} .badge.next{background:var(--orange)} .badge.lock{background:#b2bec3}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.topbar .who{color:#fff;font-weight:800;font-size:16px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.icon-btn{background:#fff;border:none;border-radius:14px;font-size:20px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.choice{
  background:#F1F2F6;border:3px solid #DFE6E9;border-radius:18px;padding:12px;cursor:pointer;
  text-align:center;font-weight:700;font-size:15px;min-width:calc(50% - 5px);flex:1;transition:transform .08s;
}
.choice:active{transform:scale(.95)}
.choice.sel{border-color:var(--purple);background:#EDEAFF}
.choice .e{font-size:40px;display:block;margin-bottom:4px}
.swatch{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer}
.swatch.sel{outline:4px solid var(--yellow)}
input[type=text]{
  width:100%;font-family:inherit;font-size:20px;font-weight:700;padding:14px 16px;border-radius:16px;
  border:3px solid #DFE6E9;margin-top:10px;outline:none;
}
input[type=text]:focus{border-color:var(--purple)}
.item-card{
  background:#fff;border-radius:20px;padding:14px;box-shadow:0 5px 0 rgba(0,0,0,.12);text-align:center;
}
.item-card .e{font-size:56px;display:block}
.item-card .n{font-weight:800;font-size:16px;margin-top:6px}
.bin-row{display:flex;gap:12px;margin-top:14px}
.bin{
  flex:1;border-radius:20px;padding:14px;text-align:center;font-weight:800;font-size:17px;color:#fff;
  cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s;
}
.bin:active{transform:scale(.95)}
.bin.fruit{background:var(--green)}
.bin.not{background:var(--orange)}
.labeled{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#F1F2F6;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:700;font-size:14px}
.bar{flex:1;height:18px;border-radius:99px;background:#F1F2F6;overflow:hidden;position:relative}
.bar>.fill{position:absolute;top:0;bottom:0;border-radius:99px}
.fill.pos{background:var(--green);left:50%}
.fill.neg{background:var(--orange);right:50%}
.brain-book-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bcard{
  border-radius:20px;padding:14px;text-align:center;min-height:120px;display:flex;flex-direction:column;
  justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.bcard.owned{background:#FFF9DB;cursor:pointer}
.bcard.missing{background:#ECEFF4;color:#B2BEC3}
.bcard .e{font-size:38px}
.bcard .t{font-weight:800;font-size:14px;margin-top:6px}
.player-card{background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.12);text-align:center;border:4px solid transparent}
.player-card.picked{border-color:var(--green)}
.player-card.sad{border-color:var(--red)}
.player-card .e{font-size:40px}
.stars{color:#FFA502;font-size:14px;letter-spacing:2px}
.confetti{position:fixed;top:-20px;font-size:24px;z-index:99;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.banner{
  background:#2D3436;color:#fff;border-radius:20px;padding:16px;margin-top:14px;font-size:15px;font-weight:600;
  box-shadow:0 5px 0 rgba(0,0,0,.25);
}
.score-line{font-size:18px;font-weight:800;margin-top:10px}
.footer-space{height:20px}
.pill{display:inline-block;background:#EDEAFF;color:var(--purple);font-weight:800;font-size:12px;border-radius:99px;padding:4px 10px;margin-top:6px}
.shake{animation:shakeX .5s}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:#F1F2F6;border-radius:16px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800;color:var(--purple)}
.stat .l{font-size:12px;color:#636e72;font-weight:700;margin-top:2px}
.conf-wrap{margin-top:14px;text-align:left}
.conf-label{font-size:13px;font-weight:800;color:#636e72;display:flex;justify-content:space-between}
.conf-bar{height:16px;border-radius:99px;background:#F1F2F6;overflow:hidden;margin-top:4px}
.conf-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--red));width:0;transition:width .9s ease}
.photo{
  background:linear-gradient(180deg,#AEE2FF 0%,#AEE2FF 58%,#BFE6C0 58%,#BFE6C0 100%);
  border-radius:20px;padding:18px 8px;display:flex;justify-content:center;gap:10px;align-items:center;
  border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.12);min-height:120px;flex-wrap:wrap;
}
.photo .pe{font-size:42px;line-height:1}
.photo .weird{outline:4px dashed var(--red);border-radius:12px;background:rgba(255,107,107,.18);animation:wiggle .5s ease 2}
.verdict-tag{font-size:15px;font-weight:800;margin-top:10px}
.bit-dance{animation:dance .8s ease-in-out 3}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-8deg) translateY(-10px)}50%{transform:rotate(8deg) translateY(0)}75%{transform:rotate(-6deg) translateY(-8px)}}
.riddle{background:#FFF9DB;border:4px solid var(--yellow)}
.riddle .badge{background:var(--orange)}
@media (prefers-reduced-motion:reduce){.bit-float,.bit-bounce,.bit-wiggle,.screen,.confetti{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= STATE ================= */
const SAVE_KEY='wonderbyte_v1';
const DEFAULT_STATE={
  profile:null, // {name,band:'A'|'B',color}
  p1:{step:0,done:false}, p2:{done:false}, p3:{done:false,best:0}, p4:{done:false}, p5:{done:false,best:0}, p6:{done:false}, p7:{done:false}, sound:true, daily:{date:'',done:false}, riddles:0,
  cards:[], upgrades:[], stories:[],
  playSeconds:0, sessions:0, breakShownAt:0
};
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));return s?Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)),s):JSON.parse(JSON.stringify(DEFAULT_STATE));}catch(e){return JSON.parse(JSON.stringify(DEFAULT_STATE));}}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(S));}
const $app=document.getElementById('app');
function T(a,b){return (S.profile&&S.profile.band==='B')?b:a;} // band-aware copy
function earnCard(id){if(!S.cards.includes(id)){S.cards.push(id);save();}}
function earnUpgrade(id){if(!S.upgrades.includes(id)){S.upgrades.push(id);save();}}
/* ================= BIT ROBOT SVG ================= */
function bitSVG(opts){
  const o=opts||{};const c=(S.profile&&S.profile.color)||'#6C5CE7';const size=o.size||150;
  const u=S.upgrades||[];const expr=o.expr||'happy';
  let extras='';
  if(u.includes('antenna'))extras+='<line x1="60" y1="18" x2="60" y2="4" stroke="#576574" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="6" r="6" fill="#FFD93D"><animate attributeName="opacity" values="1;.4;1" dur="1.2s" repeatCount="indefinite"/></circle>';
  if(u.includes('hat'))extras+='<path d="M45 24 L60 2 L75 24 Z" fill="#FF6B9D"/><circle cx="60" cy="3" r="4" fill="#FFD93D"/><rect x="44" y="22" width="32" height="6" rx="3" fill="#FFD93D"/>';
  if(u.includes('badge'))extras+='<path d="M60 78 l4 7 8 1-6 6 2 8-8-4-8 4 2-8-6-6 8-1z" fill="#FFD93D" stroke="#FFA502" stroke-width="1.5"/>';
  if(u.includes('boots'))extras+='<ellipse cx="42" cy="118" rx="12" ry="7" fill="#FF9F43"/><ellipse cx="78" cy="118" rx="12" ry="7" fill="#FF9F43"/><path d="M38 118 l-4 8 M46 118 l4 8 M74 118 l-4 8 M82 118 l4 8" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>';
  if(u.includes('cape'))extras+='<path d="M28 76 Q60 92 92 76 L86 120 Q60 130 34 120 Z" fill="#FF6B6B" opacity=".92"/>';
  if(u.includes('scarf'))extras+='<path d="M30 74 Q60 84 90 74 L90 84 Q60 94 30 84 Z" fill="#00CEC9"/><path d="M78 80 L88 108 L78 112 L70 86 Z" fill="#00CEC9"/><path d="M78 80 L88 108 L78 112 L70 86 Z" fill="none" stroke="#00a8a4" stroke-width="2"/>';
  if(u.includes('jetpack'))extras+='<rect x="8" y="62" width="16" height="34" rx="8" fill="#576574"/><rect x="96" y="62" width="16" height="34" rx="8" fill="#576574"/><circle cx="16" cy="60" r="6" fill="#FFD93D"/><circle cx="104" cy="60" r="6" fill="#FFD93D"/><path d="M12 96 q4 10 8 0 M100 96 q4 10 8 0" stroke="#FF9F43" stroke-width="4" fill="none" stroke-linecap="round"/>';
  if(u.includes('crown'))extras+='<path d="M38 22 L46 6 L56 19 L64 4 L74 19 L82 6 L84 22 Z" fill="#FFD93D" stroke="#FFA502" stroke-width="2" stroke-linejoin="round"/><circle cx="64" cy="12" r="3" fill="#FF6B9D"/>';
  let mouth='<path d="M48 56 Q60 66 72 56" stroke="#2D3436" stroke-width="4" fill="none" stroke-linecap="round"/>';
  let eyes='<circle cx="45" cy="44" r="7" fill="#2D3436"/><circle cx="75" cy="44" r="7" fill="#2D3436"/><circle cx="47" cy="42" r="2.5" fill="#fff"/><circle cx="77" cy="42" r="2.5" fill="#fff"/>';
  if(expr==='wow'){mouth='<circle cx="60" cy="60" r="7" fill="#2D3436"/>';eyes='<circle cx="45" cy="44" r="9" fill="#2D3436"/><circle cx="75" cy="44" r="9" fill="#2D3436"/><circle cx="48" cy="41" r="3" fill="#fff"/><circle cx="78" cy="41" r="3" fill="#fff"/>';}
  if(expr==='sad'){mouth='<path d="M48 62 Q60 52 72 62" stroke="#2D3436" stroke-width="4" fill="none" stroke-linecap="round"/>';eyes='<path d="M38 44 q7 -6 14 0" stroke="#2D3436" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M68 44 q7 -6 14 0" stroke="#2D3436" stroke-width="4" fill="none" stroke-linecap="round"/>';}
  if(expr==='think'){mouth='<line x1="50" y1="58" x2="70" y2="58" stroke="#2D3436" stroke-width="4" stroke-linecap="round"/>';eyes='<circle cx="45" cy="44" r="7" fill="#2D3436"/><circle cx="75" cy="44" r="7" fill="#2D3436"/><circle cx="42" cy="41" r="2.5" fill="#fff"/><circle cx="72" cy="41" r="2.5" fill="#fff"/>';}
  if(expr==='dizzy'){mouth='<path d="M48 58 q6 6 12 0 q6 -6 12 0" stroke="#2D3436" stroke-width="3.5" fill="none" stroke-linecap="round"/>';eyes='<path d="M39 39 l12 10 M51 39 l-12 10" stroke="#2D3436" stroke-width="3.5" stroke-linecap="round"/><path d="M69 39 l12 10 M81 39 l-12 10" stroke="#2D3436" stroke-width="3.5" stroke-linecap="round"/>';}
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 120 124">'+
    extras+
    '<rect x="25" y="18" width="70" height="60" rx="18" fill="'+c+'"/>'+
    '<rect x="33" y="28" width="54" height="42" rx="12" fill="#DFE6E9"/>'+
    eyes+mouth+
    '<rect x="15" y="46" width="10" height="20" rx="5" fill="'+c+'" opacity=".8"/><rect x="95" y="46" width="10" height="20" rx="5" fill="'+c+'" opacity=".8"/>'+
    '<rect x="38" y="80" width="44" height="34" rx="12" fill="'+c+'"/>'+
    '<circle cx="52" cy="94" r="4" fill="#FFD93D"/><circle cx="68" cy="94" r="4" fill="#00CEC9"/>'+
    '<rect x="44" y="112" width="10" height="8" rx="4" fill="#576574"/><rect x="66" y="112" width="10" height="8" rx="4" fill="#576574"/>'+
  '</svg>';
}
function confetti(){
  sfx('win');
  const em=['🎉','⭐','🌈','💜','✨','🎊','🤖'];
  for(let i=0;i<26;i++){
    const d=document.createElement('div');d.className='confetti';
    d.textContent=em[Math.floor(Math.random()*em.length)];
    d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    d.style.fontSize=(18+Math.random()*20)+'px';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3400);
  }
}
/* ================= SFX (tiny WebAudio, no assets) ================= */
let AC=null;
function tone(f,d,type,vol,delay){
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.05);
}
function sfx(kind){
  if(S.sound===false)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(kind==='tap'){tone(660,0.08,'triangle',0.08);}
    else if(kind==='good'){tone(523,0.12,'triangle',0.12);tone(784,0.16,'triangle',0.12,0.09);}
    else if(kind==='bad'){tone(196,0.25,'sawtooth',0.07);tone(155,0.3,'sawtooth',0.06,0.08);}
    else if(kind==='win'){tone(523,0.14,'triangle',0.12);tone(659,0.14,'triangle',0.12,0.12);tone(784,0.14,'triangle',0.12,0.24);tone(1047,0.3,'triangle',0.14,0.36);}
    else if(kind==='boing'){tone(300,0.08,'square',0.06);tone(500,0.1,'square',0.06,0.07);tone(300,0.12,'square',0.05,0.15);}
  }catch(e){}
}
/* ================= ROUTER ================= */
let timers=[];
function clearTimers(){timers.forEach(t=>clearInterval(t));timers=[];}
function go(html,after){
  clearTimers();
  $app.innerHTML=html;
  window.scrollTo(0,0);
  if(after)after();
}
/* ---- Back button: step back through screens, exit only at the first screen ---- */
const NAVBK=(function(){
  let cur=null;const stack=[];let applying=false;
  const raw=go;
  go=function(html,after){
    if(!applying&&cur){stack.push(cur);try{history.pushState({wb:1},'')}catch(e){}}
    cur={html,after};raw(html,after);
  };
  window.addEventListener('popstate',()=>{
    if(!stack.length)return; /* base screen: browser/TWA handles exit */
    applying=true;const p=stack.pop();cur=p;raw(p.html,p.after);applying=false;
  });
  return {};
})();
function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
/* ================= PARENT GATE ================= */
let gateTarget='setup';
function showGate(target){
  gateTarget=target;
  const a=6+Math.floor(Math.random()*4), b=6+Math.floor(Math.random()*4);
  go(`
    <div class="screen on center">
      <div class="card" style="margin-top:60px">
        <span class="big-emoji">🛡️</span>
        <h2 style="margin-top:8px">Grown-ups only!</h2>
        <p class="muted" style="margin-top:6px">This door is for parents. Kids, grab a grown-up!</p>
        <p style="font-size:26px;font-weight:800;margin-top:14px">What is ${a} × ${b}?</p>
        <input type="text" inputmode="numeric" id="gate-answer" placeholder="Your answer">
        <p class="muted" id="gate-err" style="color:var(--red);min-height:18px;margin-top:6px"></p>
        <button class="btn" id="gate-go">Open the door</button>
      </div>
    </div>`,()=>{
      document.getElementById('gate-go').onclick=()=>{
        const v=parseInt(document.getElementById('gate-answer').value,10);
        if(v===a*b){ if(gateTarget==='setup')showSetup(); else showParent(); }

/* ================= LESSON 1: TRAIN-THE-CLASSIFIER ================= */
const FEATS={red:'🔴 red',green:'🟢 green',yellow:'🟡 yellow',purple:'🟣 purple',round:'⭕ round',long:'📏 long',sweet:'🍬 sweet',crunchy:'🥨 crunchy',toy:'🧸 toy',stem:'🌱 stem',leafy:'🍃 leafy',bushy:'🌳 bushy'};
const ITEMS={
  apple:{e:'🍎',n:'Apple',fruit:true,f:['red','round','sweet','stem']},
  strawberry:{e:'🍓',n:'Strawberry',fruit:true,f:['red','round','sweet']},
  cherry:{e:'🍒',n:'Cherries',fruit:true,f:['red','round','sweet','stem']},
  watermelon:{e:'🍉',n:'Watermelon',fruit:true,f:['red','round','sweet']},
  cucumber:{e:'🥒',n:'Cucumber',fruit:false,f:['green','long','crunchy']},
  broccoli:{e:'🥦',n:'Broccoli',fruit:false,f:['green','bushy','crunchy']},
  lettuce:{e:'🥬',n:'Lettuce',fruit:false,f:['green','leafy','crunchy']},
  pepper:{e:'🫑',n:'Green pepper',fruit:false,f:['green','crunchy']},
  greenapple:{e:'🍏',n:'Green apple',fruit:true,f:['green','sweet']},
  banana:{e:'🍌',n:'Banana',fruit:true,f:['yellow','long','sweet']},
  ball:{e:'🔴',n:'Red ball',fruit:false,f:['red','toy']},
  eggplant:{e:'🍆',n:'Eggplant',fruit:false,f:['purple','long']}
};
const L1_TRAIN=['apple','strawberry','cherry','watermelon','cucumber','broccoli','lettuce','pepper'];
const L1_TEST=['greenapple','ball','strawberry','cucumber'];
const L1_FIX=['greenapple','banana','ball','eggplant'];
let model={};
function trainModel(labeled){
  // labeled: [{id, fruit}] -> per-feature vote (f-n)/max(f,n)
  const fc={},nc={};
  labeled.forEach(l=>{ITEMS[l.id].f.forEach(f=>{if(l.fruit)fc[f]=(fc[f]||0)+1;else nc[f]=(nc[f]||0)+1;});});
  model={};
  Object.keys(FEATS).forEach(k=>{
    const f=fc[k]||0,n=nc[k]||0;
    model[k]=(f===n)?0:(f-n)/Math.max(f,n);
  });
}
function predict(id){
  let s=0;ITEMS[id].f.forEach(f=>s+=(model[f]||0));
  if(s>0.15)return{say:true,score:s};
  if(s<-0.15)return{say:false,score:s};
  return{say:false,score:s,confused:true};
}

function mmRound(idx,score,log){
  if(idx>=MM.length){mmEnd(score,log);return;}
  const c=MM[idx];
  go(`
    <div class="screen on">
      <div class="topbar"><button class="icon-btn" id="back">🗺️</button><div class="who">🏔️ Question ${idx+1} of ${MM.length}</div><span style="width:40px"></span></div>
      <div class="bit-wrap">${bitSVG({size:90,expr:'happy'})}</div>
      <div class="speech">${c.bit}</div>
      <div class="card">
        <h2 class="center" style="font-size:19px">${c.q}</h2>
        <div class="conf-wrap">
          <div class="conf-label"><span>Bit's confidence</span><span>${c.conf}%</span></div>
          <div class="conf-bar"><div class="conf-fill" id="cf"></div></div>
        </div>
        <div class="bin-row">
          <div class="bin fruit" id="trust">🤝 I believe you!</div>
          <div class="bin not" id="check">🔍 Let me check!</div>
        </div>
        <div id="reveal"></div>
      </div>
      <div class="score-line center" style="color:#fff" id="mm-score">Stars: ${score} ⭐</div>
    </div>`,()=>{
      document.getElementById('back').onclick=showMap;
      setTimeout(()=>{const cf=document.getElementById('cf');if(cf)cf.style.width=c.conf+'%';},60);
      const decide=(checked)=>{
        const caught=checked&&!c.truth;
        const smart=!checked&&c.truth;
        if(caught||smart){score++;const ms=document.getElementById('mm-score');if(ms)ms.textContent='Stars: '+score+' ⭐';}
        log.push({conf:c.conf,wrong:!c.truth});
        document.getElementById('trust').style.display='none';
        document.getElementById('check').style.display='none';
        const r=document.getElementById('reveal');
        let head;
        if(caught)head=`<div class="score-line" style="color:var(--green)">⭐ Caught me! I was WRONG - great checking!</div>`;
        else if(checked)head=`<div class="score-line" style="color:var(--orange)">Good instinct to check - and I was right this time!</div>`;
        else if(smart)head=`<div class="score-line" style="color:var(--green)">✅ Correct - I really did know that one!</div>`;
        else head=`<div class="score-line" style="color:var(--red)">😬 Oh no - I was WRONG and you believed me!</div>`;
        r.innerHTML=head+`
          <p style="font-weight:600;margin-top:8px"><b>The truth:</b> ${c.fact}</p>
          <button class="btn teal" id="mm-next">${idx+1<MM.length?'Next question':'See the big reveal!'}</button>`;
        earnCard('verify');
        document.getElementById('mm-next').onclick=()=>mmRound(idx+1,score,log);
      };
      document.getElementById('trust').onclick=()=>decide(false);
      document.getElementById('check').onclick=()=>decide(true);
    });
}

function dvRound(idx,score){
  if(idx>=DV.length){dvEnd(score);return;}
  const c=DV[idx];
  go(`
    <div class="screen on">
      <div class="topbar"><button class="icon-btn" id="back">🗺️</button><div class="who">🌋 Photo ${idx+1} of ${DV.length}</div><span style="width:40px"></span></div>
      <div class="bit-wrap">${bitSVG({size:80,expr:'think'})}</div>
      <div class="speech">From my camera roll: "${c.name}". Real or trick?</div>
      <div class="card center">
        <div class="photo" id="photo">${c.tiles.map(t=>`<span class="pe">${t}</span>`).join('')}</div>
        <div class="bin-row">
          <div class="bin fruit" id="real">📷 REAL photo</div>
          <div class="bin not" id="trick">🐒 TRICK!</div>
        </div>
        <div id="dv-verdict"></div>
      </div>
      <div class="score-line center" style="color:#fff">Score: ${score} ⭐</div>
    </div>`,()=>{
      document.getElementById('back').onclick=showMap;
      const answer=(saidTrick)=>{
        const isTrick=c.weird>=0;
        const right=saidTrick===isTrick;
        if(right){score++;earnCard('healthy-doubt');const ds=document.getElementById('dv-score');if(ds)ds.textContent='Score: '+score+' ⭐';}
        document.getElementById('real').style.display='none';
        document.getElementById('trick').style.display='none';
        if(isTrick){
          const pes=document.querySelectorAll('#photo .pe');
          if(pes[c.weird])pes[c.weird].classList.add('weird');
        }
        document.getElementById('dv-verdict').innerHTML=`
          <div class="score-line" style="color:${right?'var(--green)':'var(--red)'}">${right?'✅ Sharp eyes!':'❌ The monkey got you!'}</div>
          <p style="font-weight:700;margin-top:8px">${isTrick?c.clue:c.clue}</p>
          <p style="font-weight:600;margin-top:6px;font-size:14px" class="muted">${c.why}</p>
          <button class="btn teal" id="dv-next">${idx+1<DV.length?'Next photo':'Finish the climb!'}</button>`;
        document.getElementById('dv-next').onclick=()=>dvRound(idx+1,score);
      };
      document.getElementById('real').onclick=()=>answer(false);
      document.getElementById('trick').onclick=()=>answer(true);
    });
}

function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dayOfYear(){const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}
function showDailyRiddle(){
  const slot=document.getElementById('riddle-slot');
  if(!slot||!S.daily)return;
  if(S.daily.date===todayStr()&&S.daily.done)return;
  const r=RIDDLES[dayOfYear()%RIDDLES.length];
  slot.innerHTML=`<div class="island riddle" id="riddle-open">
    <div class="scene">🌞</div>
    <div class="meta"><h3>Bit's Daily Riddle</h3><p>${r.q.length>60?r.q.slice(0,57)+'...':r.q}</p></div>
    <span class="badge next">NEW!</span>
  </div>`;
  document.getElementById('riddle-open').onclick=()=>playRiddle(r);
}

        <div id="rid-why"></div>
      </div>

      document.getElementById('back').onclick=showMap;
      document.querySelectorAll('.choice').forEach(ch=>ch.onclick=()=>{

function wordId(w){return 'word-'+w.toLowerCase().replace(/[^a-z0-9]+/g,'-');}
function showWordOfDay(){
  const slot=document.getElementById('wotd-slot');
  if(!slot)return;
  const i1=dayOfYear()%WOTD.length, i2=(dayOfYear()+1)%WOTD.length;
  slot.innerHTML=`<div class="wotd-strip">${[i1,i2].map(k=>{const w=WOTD[k];const got=S.cards.includes(wordId(w.w));return `
    <div class="wotd-card" data-k="${k}">
      <span class="wotd-emoji">${w.e}</span>
      <div class="wotd-label">WORD OF THE DAY${got?' · COLLECTED ✓':''}</div>
      <div class="wotd-word">${w.w}</div>
      <div class="wotd-def">${w.d}</div>
    </div>`}).join('')}</div>`;
  slot.querySelectorAll('.wotd-card').forEach(el=>el.onclick=()=>{sfx('tap');showWordCard(parseInt(el.dataset.k,10));});
}
function showWordCard(k,backFn){
  const w=WOTD[k];
  const wid=wordId(w.w);
  const owned=S.cards.includes(wid);
  const ret=backFn||showMap;
  go(`
    <div class="screen on">
      <div class="topbar"><button class="icon-btn" id="back">${backFn?'📚':'🗺️'}</button><div class="who">💡 ${backFn?'Word Pack':'Word of the Day'}</div><span style="width:40px"></span></div>

function packProgress(pid){
  const words=WOTD.map((w,i)=>({w,i})).filter(x=>x.w.p===pid);
  const got=words.filter(x=>S.cards.includes(wordId(x.w.w))).length;
  return {words:words,got:got};
}

  {e:'🦁',n:'Lion'},{e:'🐙',n:'Octopus'},{e:'🦄',n:'Unicorn'},{e:'🐧',n:'Penguin'},
  {e:'🐝',n:'Bee'},{e:'🐢',n:'Turtle'},{e:'🦉',n:'Owl'},{e:'🐬',n:'Dolphin'}
];
const GG_SPECIAL={
  'Lion+Octopus':{n:'Octolion',j:'Eight tentacles AND a mane. Hugs you and roars at you at the same time.'},
  'Octopus+Lion':{n:'Octolion',j:'Eight tentacles AND a mane. Hugs you and roars at you at the same time.'},
  'Penguin+Bee':{n:'Bumbleguin',j:'A tiny penguin with wings. Buzzes around the iceberg, still cannot fly properly.'},
  'Bee+Penguin':{n:'Bumbleguin',j:'A tiny penguin with wings. Buzzes around the iceberg, still cannot fly properly.'},
  'Unicorn+Dolphin':{n:'Dolphicorn',j:'The most magical creature in the sea. Neighs in bubbles.'},
  'Dolphin+Unicorn':{n:'Dolphicorn',j:'The most magical creature in the sea. Neighs in bubbles.'},
  'Turtle+Owl':{n:'Hootle',j:'Wise AND slow. Gives you advice next Tuesday.'},
  'Owl+Turtle':{n:'Hootle',j:'Wise AND slow. Gives you advice next Tuesday.'}
};
function ggMash(a,b){
  const sp=GG_SPECIAL[a.n+'+'+b.n];
  if(sp)return sp;
  const n=a.n.slice(0,Math.ceil(a.n.length/2))+b.n.slice(Math.floor(b.n.length/2)).toLowerCase();
  return {n:n.charAt(0).toUpperCase()+n.slice(1),j:'Half '+a.n.toLowerCase()+', half '+b.n.toLowerCase()+'. 100% ridiculous.'};
}

function ggMix(a,b){
  const m=ggMash(a,b);

    <div class="screen on">
      <div class="topbar"><span style="width:40px"></span><div class="who">🌳 Growing...</div><span style="width:40px"></span></div>

      <div class="speech">Mixing ${a.e} and ${b.e}... whirrrr... beep...</div>
      <div class="card center"><h2>🌱 Mixing patterns...</h2></div>
    </div>`,()=>{
      setTimeout(()=>{
        sfx('good');
        go(`

          <div class="topbar"><span style="width:40px"></span><div class="who">🌳 It's alive!</div><span style="width:40px"></span></div>

function ggSecret(){
  go(`
    <div class="screen on">
      <div class="topbar"><span style="width:40px"></span><div class="who">🤫 The big secret</div><span style="width:40px"></span></div>
      <div class="bit-wrap">${bitSVG({size:110,expr:'think'})}</div>
      <div class="speech">Quiz time, ${esc(S.profile.name)}: could I invent a creature that is NOTHING like anything I have ever seen?</div>
      <div class="card center">
        <div class="choices">
          <div class="choice" id="gg-y"><span class="e">🌟</span>Yes! You're magic!</div>
          <div class="choice" id="gg-n"><span class="e">🧩</span>No - you only remix what you learned</div>
        </div>
        <div id="gg-verdict"></div>
      </div>
    </div>`,()=>{
      const done=(right)=>{
        document.getElementById('gg-y').style.pointerEvents='none';
        document.getElementById('gg-n').style.pointerEvents='none';
        document.getElementById('gg-verdict').innerHTML=`
          <div class="score-line" style="color:${right?'var(--green)':'var(--red)'}">${right?'✅ Exactly right!':'❌ Tricked you!'}</div>
          <p style="font-weight:600;margin-top:8px">${T(
            'I can ONLY mix patterns from my training data. The Dolphicorn exists because I know dolphins AND unicorns. Show me nothing, and I know nothing. AI is a remix machine - the examples are EVERYTHING!',
            'Generative AI recombines patterns from its training data - every output traces back to examples it learned from. That is why training data decides everything: what it can make, what it can\'t, and whose work it echoes.')}</p>
          <button class="btn green" id="gg-fin">Finish the Grove! 🌳</button>`;
        if(right)sfx('good');else sfx('bad');
        document.getElementById('gg-fin').onclick=ggEnd;
      };
      document.getElementById('gg-y').onclick=()=>done(false);
      document.getElementById('gg-n').onclick=()=>done(true);
    });
}

/* ================= BOOT ================= */
setInterval(()=>{if(S.profile&&!document.hidden){S.playSeconds++;if(S.playSeconds%10===0)save();}},1000);
window.addEventListener('pagehide',()=>{try{save();}catch(e){}});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
if(S.profile){S.sessions++;save();showMap();}
else showGate('setup');
</script>
